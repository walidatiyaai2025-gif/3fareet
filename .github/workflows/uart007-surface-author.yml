name: UART007 Surface Author

on:
  push:
    branches:
      - agent/uart-007-authored-track-dressing
    paths:
      - .github/workflows/uart007-surface-author.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uart-007-authored-track-dressing
      - name: Enumerate finish gate geometry and invalid face references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/assets/02_tracks_environments/cairo_track_dressing/source/SM_Track_FinishGate_A.obj')
          lines = p.read_text(encoding='utf-8').splitlines()
          vertices=[]
          faces=[]
          current_group=''
          for line_no, raw in enumerate(lines, 1):
              line=raw.strip()
              if line.startswith('g '):
                  current_group=line[2:].strip()
              elif line.startswith('v '):
                  vertices.append((len(vertices)+1, line_no, current_group, line))
              elif line.startswith('f '):
                  refs=[int(tok.split('/')[0]) for tok in line.split()[1:]]
                  faces.append((line_no,current_group,refs,line))
          print(f'VERTEX_COUNT={len(vertices)} FACE_COUNT={len(faces)} MAX_FACE_REF={max(max(x[2]) for x in faces)}')
          print('LAST_VERTICES')
          for item in vertices[-60:]:
              print(item)
          print('INVALID_FACES')
          for item in faces:
              if any(i < 1 or i > len(vertices) for i in item[2]):
                  print(item)
          PY
