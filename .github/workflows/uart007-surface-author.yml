name: UART007 Surface Author

on:
  push:
    branches:
      - agent/uart-007-authored-track-dressing
    paths:
      - .github/workflows/uart007-surface-author.yml

permissions:
  contents: write

concurrency:
  group: uart007-surface-author
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/uart-007-authored-track-dressing
          fetch-depth: 0

      - name: Repair malformed finish gate and surface four sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/uart-007-authored-track-dressing
          git reset --hard origin/agent/uart-007-authored-track-dressing
          git fetch origin 5cf93078004fd511c84534a5a1af3c27e3849462
          git show 5cf93078004fd511c84534a5a1af3c27e3849462:tools/android/surface_obj_candidate.py > /tmp/surface_obj_candidate.py

          ROOT="docs/assets/02_tracks_environments/cairo_track_dressing/source"
          TOOL="/tmp/surface_obj_candidate.py"

          python - <<'PY'
          from __future__ import annotations
          import math
          from pathlib import Path

          path = Path('docs/assets/02_tracks_environments/cairo_track_dressing/source/SM_Track_FinishGate_A.obj')
          original = path.read_text(encoding='utf-8').splitlines()
          vertices = [line.strip() for line in original if line.strip().startswith('v ')]
          faces = [line.strip() for line in original if line.strip().startswith('f ')]
          max_ref = max(int(tok.split('/')[0]) for face in faces for tok in face.split()[1:])
          if len(vertices) != 235 or max_ref != 251:
              raise SystemExit(f'Finish gate source changed; refusing blind repair vertices={len(vertices)} maxRef={max_ref}')

          # Preserve the validated pylon/trim source geometry exactly (v1..v160)
          # and its existing faces. The original Arch section was truncated by 16
          # vertices, shifting Crest/Spirit/Gold references out of range.
          prefix_vertices = vertices[:160]
          face_start = next(i for i, line in enumerate(original) if line.strip() == 'g Pylon')
          arch_group = next(i for i, line in enumerate(original) if line.strip() == 'g Arch')
          stable_faces = [line.rstrip() for line in original[face_start:arch_group]]

          out = [
              '# 3Fareet UART-007 authored finish gate candidate',
              '# repaired malformed Arch source: preserved pylon/trim v1..v160',
              'o SM_Track_FinishGate_A',
              's 1',
              *prefix_vertices,
          ]

          coords: list[tuple[float,float,float]] = []
          groups: list[tuple[str,list[tuple[int,int,int]]]] = []

          def add_vertex(x: float, y: float, z: float) -> int:
              coords.append((x,y,z))
              return 160 + len(coords)

          def quad(a:int,b:int,c:int,d:int, reverse:bool=False):
              return [(a,c,b),(a,d,c)] if reverse else [(a,b,c),(a,c,d)]

          # Thick elliptical arch ring, 20 segments / four authored edge rows.
          segments = 20
          base_y = 4.55
          outer_rx, outer_ry = 6.20, 4.65
          inner_rx, inner_ry = 5.25, 3.75
          z_front, z_back = -0.45, 0.45
          rows = {}
          for name, rx, ry, z in (
              ('outer_front', outer_rx, outer_ry, z_front),
              ('inner_front', inner_rx, inner_ry, z_front),
              ('outer_back', outer_rx, outer_ry, z_back),
              ('inner_back', inner_rx, inner_ry, z_back),
          ):
              row=[]
              for i in range(segments+1):
                  t = math.pi * i / segments
                  row.append(add_vertex(rx*math.cos(t), base_y + ry*math.sin(t), z))
              rows[name]=row

          arch=[]
          for i in range(segments):
              of0,of1=rows['outer_front'][i],rows['outer_front'][i+1]
              inf0,inf1=rows['inner_front'][i],rows['inner_front'][i+1]
              ob0,ob1=rows['outer_back'][i],rows['outer_back'][i+1]
              inb0,inb1=rows['inner_back'][i],rows['inner_back'][i+1]
              arch += quad(of0,of1,inf1,inf0)
              arch += quad(ob0,inb0,inb1,ob1)
              arch += quad(of0,ob0,ob1,of1)
              arch += quad(inf0,inf1,inb1,inb0)
          # Close both feet of the arch volume.
          arch += quad(rows['outer_front'][0], rows['inner_front'][0], rows['inner_back'][0], rows['outer_back'][0])
          arch += quad(rows['outer_front'][-1], rows['outer_back'][-1], rows['inner_back'][-1], rows['inner_front'][-1])
          groups.append(('Arch', arch))

          # Crown cylinder above the arch.
          crown=[]
          ring_bottom=[]; ring_top=[]
          crown_segments=12
          for y, target in ((9.95, ring_bottom),(10.25, ring_top)):
              for i in range(crown_segments):
                  t=2*math.pi*i/crown_segments
                  target.append(add_vertex(.78*math.cos(t), y, .78*math.sin(t)))
          bottom_center=add_vertex(0,9.95,0)
          top_center=add_vertex(0,10.25,0)
          for i in range(crown_segments):
              j=(i+1)%crown_segments
              crown += quad(ring_bottom[i],ring_bottom[j],ring_top[j],ring_top[i])
              crown.append((bottom_center,ring_bottom[j],ring_bottom[i]))
              crown.append((top_center,ring_top[i],ring_top[j]))
          groups.append(('Crest', crown))

          def box_vertices(x0,x1,y0,y1,z0,z1):
              return [
                  add_vertex(x0,y0,z0), add_vertex(x1,y0,z0),
                  add_vertex(x1,y1,z0), add_vertex(x0,y1,z0),
                  add_vertex(x0,y0,z1), add_vertex(x1,y0,z1),
                  add_vertex(x1,y1,z1), add_vertex(x0,y1,z1),
              ]

          def box_faces(v):
              a,b,c,d,e,f,g,h=v
              return [
                  (a,b,c),(a,c,d),(e,g,f),(e,h,g),
                  (a,e,f),(a,f,b),(b,f,g),(b,g,c),
                  (c,g,h),(c,h,d),(d,h,e),(d,e,a),
              ]

          # Preserve the authored split-blade silhouette around the crown.
          groups.append(('Spirit', box_faces(box_vertices(-3.70,-0.30,9.66,9.84,-0.16,0.16))))
          groups.append(('Gold', box_faces(box_vertices(0.30,3.70,9.66,9.84,-0.16,0.16))))

          for x,y,z in coords:
              out.append(f'v {x:.5f} {y:.5f} {z:.5f}')
          out.extend(stable_faces)
          for group_name, tris in groups:
              out.append(f'g {group_name}')
              for a,b,c in tris:
                  out.append(f'f {a} {b} {c}')

          path.write_text('\n'.join(out)+'\n', encoding='utf-8')

          # Fail closed on OBJ reference integrity before surface authoring.
          repaired = path.read_text(encoding='utf-8').splitlines()
          vcount=sum(1 for line in repaired if line.startswith('v '))
          tri_count=sum(max(0,len(line.split())-3) for line in repaired if line.startswith('f '))
          for line in repaired:
              if not line.startswith('f '):
                  continue
              for token in line.split()[1:]:
                  ref=int(token.split('/')[0])
                  if ref < 1 or ref > vcount:
                      raise SystemExit(f'repaired face out of range ref={ref} vertices={vcount}: {line}')
          print(f'AFAREET_UART007_FINISH_GATE_REPAIR_OK vertices={vcount} triangles={tri_count}')
          PY

          python "$TOOL" "$ROOT/SM_Track_FinishGate_A.obj" --material-file SM_Track_FinishGate_A.mtl --material FinishGate_Metal --write
          python "$TOOL" "$ROOT/SM_Track_SpiritRune_A.obj" --material-file SM_Track_SpiritRune_A.mtl --material SpiritRune_Surface --write
          python "$TOOL" "$ROOT/SM_Track_DesertGround_A.obj" --material-file SM_Track_DesertGround_A.mtl --material DesertGround_Sand --write
          python "$TOOL" "$ROOT/SM_Track_SectorBeacon_A.obj" --material-file SM_Track_SectorBeacon_A.mtl --material SectorBeacon_Metal --write

          cat > "$ROOT/SM_Track_FinishGate_A.mtl" <<'EOF'
          # UART-007 authored-source candidate material
          newmtl FinishGate_Metal
          Ka 0.070000 0.055000 0.045000
          Kd 0.330000 0.245000 0.175000
          Ks 0.480000 0.390000 0.280000
          Ns 80.000000
          illum 2
          map_Kd T_Track_FinishGate_BC.png
          EOF
          cat > "$ROOT/SM_Track_SpiritRune_A.mtl" <<'EOF'
          # UART-007 authored-source candidate material
          newmtl SpiritRune_Surface
          Ka 0.030000 0.025000 0.050000
          Kd 0.220000 0.120000 0.410000
          Ks 0.210000 0.190000 0.300000
          Ns 36.000000
          illum 2
          map_Kd T_Track_SpiritRune_BC.png
          EOF
          cat > "$ROOT/SM_Track_DesertGround_A.mtl" <<'EOF'
          # UART-007 authored-source candidate material
          newmtl DesertGround_Sand
          Ka 0.120000 0.090000 0.055000
          Kd 0.560000 0.390000 0.210000
          Ks 0.050000 0.040000 0.030000
          Ns 8.000000
          illum 2
          map_Kd T_Track_DesertGround_BC.png
          EOF
          cat > "$ROOT/SM_Track_SectorBeacon_A.mtl" <<'EOF'
          # UART-007 authored-source candidate material
          newmtl SectorBeacon_Metal
          Ka 0.030000 0.055000 0.070000
          Kd 0.100000 0.390000 0.460000
          Ks 0.280000 0.530000 0.590000
          Ns 68.000000
          illum 2
          map_Kd T_Track_SectorBeacon_BC.png
          EOF

          python - <<'PY'
          from __future__ import annotations
          import json, struct, zlib
          from pathlib import Path
          root=Path('docs/assets/02_tracks_environments/cairo_track_dressing/source')
          def chunk(kind,data):
              return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)
          def png(path,base,accent,mode):
              w=h=64; rows=bytearray()
              for y in range(h):
                  rows.append(0)
                  for x in range(w):
                      if mode=='sand': mark=((x*13+y*7)%23)<2
                      elif mode=='rune': mark=abs(x-y)<=1 or abs((63-x)-y)<=1 or x%16==0
                      elif mode=='metal': mark=x%16 in (0,1) or y%16 in (0,1)
                      else: mark=x%12 in (0,1) or y%18 in (0,1)
                      src=accent if mark else tuple(min(255,c+(8 if ((x//8+y//8)%2) else 0)) for c in base)
                      rows.extend(src)
              payload=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(rows),9))+chunk(b'IEND',b'')
              path.write_bytes(payload)
          png(root/'T_Track_FinishGate_BC.png',(92,70,52),(190,136,64),'metal')
          png(root/'T_Track_SpiritRune_BC.png',(38,28,62),(150,66,220),'rune')
          png(root/'T_Track_DesertGround_BC.png',(142,102,55),(176,132,73),'sand')
          png(root/'T_Track_SectorBeacon_BC.png',(30,94,108),(58,205,224),'beacon')

          def stats(path):
              v=t=0
              for raw in path.read_text(encoding='utf-8').splitlines():
                  line=raw.strip()
                  if line.startswith('v '): v+=1
                  elif line.startswith('f '): t+=max(0,len(line.split())-3)
              return v,t

          manifest_path=Path('docs/assets/02_tracks_environments/cairo_track_dressing/ASSET_MANIFEST.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          for module in manifest['modules']:
              v,t=stats(root/module['model'])
              module['currentVertices']=v
              module['currentTriangles']=t
              module['surfaceAuthoring']='tracked-uv-normal-mtl-texture-candidate'
          manifest['sourceSurfaceProgress']='4/4'
          manifest['finishGateTopologyRepair']='malformed-arch-rebuilt-pylon-trim-preserved'
          manifest['acceptancePending']=[
              'licensed Unity compile/import/render proof for all four dressing Resources',
              'final visual material/texture refinement after licensed Unity render review',
              'additional track signage/decals/roadside dressing',
              'exact Android in-race screenshot/video proof',
              'owner/Art Director Visual Gate acceptance'
          ]
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')

          test_path=Path('tools/android/tests/test_cairo_authored_track_dressing_contract.py')
          text=test_path.read_text(encoding='utf-8')
          marker='''EXPECTED_MODELS = {
              "SM_Track_FinishGate_A.obj",
              "SM_Track_SpiritRune_A.obj",
              "SM_Track_DesertGround_A.obj",
              "SM_Track_SectorBeacon_A.obj",
          }
          '''
          surfaced=marker+'''
          SURFACED = (
              ("SM_Track_FinishGate_A.obj", "SM_Track_FinishGate_A.mtl", "FinishGate_Metal", "T_Track_FinishGate_BC.png"),
              ("SM_Track_SpiritRune_A.obj", "SM_Track_SpiritRune_A.mtl", "SpiritRune_Surface", "T_Track_SpiritRune_BC.png"),
              ("SM_Track_DesertGround_A.obj", "SM_Track_DesertGround_A.mtl", "DesertGround_Sand", "T_Track_DesertGround_BC.png"),
              ("SM_Track_SectorBeacon_A.obj", "SM_Track_SectorBeacon_A.mtl", "SectorBeacon_Metal", "T_Track_SectorBeacon_BC.png"),
          )
          '''
          if marker not in text: raise SystemExit('EXPECTED_MODELS block changed')
          text=text.replace(marker,surfaced,1)
          insertion='''    def test_sources_clear_manifest_anti_blockout_floors(self):
          '''
          extra='''    def _assert_surface_chain(self, model, mtl_file, material, texture):
                  obj=(SOURCE_ROOT/model).read_text(encoding="utf-8")
                  mtl=(SOURCE_ROOT/mtl_file).read_text(encoding="utf-8")
                  self.assertIn(f"mtllib {mtl_file}",obj)
                  self.assertIn(f"usemtl {material}",obj)
                  self.assertIn("\nvt ","\n"+obj)
                  self.assertIn("\nvn ","\n"+obj)
                  self.assertIn(f"newmtl {material}",mtl)
                  self.assertIn(f"map_Kd {texture}",mtl)
                  self.assertTrue((SOURCE_ROOT/texture).read_bytes().startswith(b"\x89PNG\r\n\x1a\n"))
                  vertices=sum(1 for line in obj.splitlines() if line.startswith("v "))
                  for face in (line for line in obj.splitlines() if line.startswith("f ")):
                      for token in face.split()[1:]:
                          fields=token.split("/")
                          self.assertEqual(3,len(fields),token)
                          self.assertTrue(fields[1] and fields[2],token)
                          self.assertGreaterEqual(int(fields[0]),1,token)
                          self.assertLessEqual(int(fields[0]),vertices,token)

              def test_all_four_sources_have_tracked_surface_chains_and_valid_face_indices(self):
                  manifest=json.loads(MANIFEST.read_text(encoding="utf-8"))
                  self.assertEqual("4/4",manifest["sourceSurfaceProgress"])
                  self.assertEqual("malformed-arch-rebuilt-pylon-trim-preserved",manifest["finishGateTopologyRepair"])
                  modules={m["model"]:m for m in manifest["modules"]}
                  self.assertEqual(4,sum(m.get("surfaceAuthoring")=="tracked-uv-normal-mtl-texture-candidate" for m in modules.values()))
                  for surface in SURFACED:
                      with self.subTest(model=surface[0]):
                          self._assert_surface_chain(*surface)
                          v,t=obj_stats(SOURCE_ROOT/surface[0])
                          self.assertEqual(v,modules[surface[0]]["currentVertices"])
                          self.assertEqual(t,modules[surface[0]]["currentTriangles"])

          '''+insertion
          if insertion not in text: raise SystemExit('test insertion point changed')
          text=text.replace(insertion,extra,1)
          test_path.write_text(text,encoding='utf-8',newline='\n')
          PY

          python "$TOOL" "$ROOT/SM_Track_FinishGate_A.obj" --material-file SM_Track_FinishGate_A.mtl --material FinishGate_Metal --check
          python "$TOOL" "$ROOT/SM_Track_SpiritRune_A.obj" --material-file SM_Track_SpiritRune_A.mtl --material SpiritRune_Surface --check
          python "$TOOL" "$ROOT/SM_Track_DesertGround_A.obj" --material-file SM_Track_DesertGround_A.mtl --material DesertGround_Sand --check
          python "$TOOL" "$ROOT/SM_Track_SectorBeacon_A.obj" --material-file SM_Track_SectorBeacon_A.mtl --material SectorBeacon_Metal --check
          python -m py_compile tools/android/tests/test_cairo_authored_track_dressing_contract.py
          python -m unittest tools.android.tests.test_cairo_authored_track_dressing_contract
          git diff --check

      - name: Commit repair and authored surface chains
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "3Fareet UART-007 Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/uart007-surface-author.yml
          git add docs/assets/02_tracks_environments/cairo_track_dressing tools/android/tests/test_cairo_authored_track_dressing_contract.py
          git status --short
          git commit -m "UART-007: repair finish gate and surface track dressing"
          git push origin HEAD:agent/uart-007-authored-track-dressing
