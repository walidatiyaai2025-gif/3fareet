name: P1 Operator Release Chain

on:
  pull_request:
    paths:
      - 'tools/android/p1_operator_release_chain.json'
      - 'tools/android/validate_hero_asset_intake.py'
      - 'tools/android/p1_visual_source_readiness.py'
      - 'tools/android/p1_licensed_staging_readiness.py'
      - 'tools/android/validate_hero_asset_intake_windows.ps1'
      - 'tools/android/stage_production_candidate_windows.ps1'
      - 'tools/android/run_p1_staged_candidate_windows.ps1'
      - 'tools/android/prepare_p1_candidate_device.py'
      - 'tools/android/device_evidence.py'
      - 'tools/android/export_p1_device_evidence.py'
      - 'tools/android/verify_p1_device_review_bundle.py'
      - 'tools/android/p1_lineage_gate_readiness.py'
      - 'tools/android/verify_p1_release_publication.py'
      - 'tools/android/tests/test_p1_operator_release_chain_contract.py'
      - 'docs/RELEASE_POLICY.md'
      - '.github/workflows/p1-operator-release-chain.yml'

permissions:
  contents: read

jobs:
  operator-chain-contract:
    name: P1 authoritative operator-chain contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate machine-readable chain
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool tools/android/p1_operator_release_chain.json >/dev/null

      - name: Validate publication preflight CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/android/verify_p1_release_publication.py
          python3 tools/android/verify_p1_release_publication.py --help >/dev/null

      - name: Execute authoritative operator-chain contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/android/tests -p 'test_p1_operator_release_chain_contract.py' -v
