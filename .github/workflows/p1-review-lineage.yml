name: P1 Review Lineage Binding

on:
  pull_request:
    paths:
      - 'tools/android/export_p1_device_evidence.py'
      - 'tools/android/verify_p1_device_review_bundle.py'
      - 'tools/android/tests/test_p1_review_lineage_binding.py'
      - '.github/workflows/p1-review-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-review-lineage:
    name: P1 sanitized review lineage contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python syntax and CLI contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/android/export_device_evidence.py \
            tools/android/verify_device_review_bundle.py \
            tools/android/export_p1_device_evidence.py \
            tools/android/verify_p1_device_review_bundle.py
          python3 tools/android/export_p1_device_evidence.py --help >/dev/null
          python3 tools/android/verify_p1_device_review_bundle.py --help >/dev/null

      - name: Execute P1 review-lineage regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/android/tests -p 'test_p1_review_lineage_binding.py' -v
