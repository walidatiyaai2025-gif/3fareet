name: Unity Production CI

on:
  pull_request:
    paths:
      - 'unity_game/**'
      - 'docs/assets/01_vehicles/**'
      - 'docs/assets/02_tracks_environments/**'
      - '.github/workflows/unity-ci.yml'
      - '.github/scripts/verify-unity-android-apk.sh'
  push:
    branches:
      - main
    paths:
      - 'unity_game/**'
      - 'docs/assets/01_vehicles/**'
      - 'docs/assets/02_tracks_environments/**'
      - '.github/workflows/unity-ci.yml'
      - '.github/scripts/verify-unity-android-apk.sh'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-production-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_PROJECT_PATH: unity_game
  UNITY_VERSION: 6000.5.8f1

jobs:
  static-contract:
    name: Unity CI static contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Validate Android CI contract without Unity
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/verify-unity-android-apk.sh
          grep -Fq 'public static void BuildAndroid()' unity_game/Assets/Afareet/Editor/AfareetBuild.cs
          grep -Fq 'com.fiftysolutions.afareetunity3d' unity_game/Assets/Afareet/Editor/AfareetBuild.cs
          grep -Fq 'AndroidArchitecture.ARM64' unity_game/Assets/Afareet/Editor/AfareetBuild.cs
          grep -Fq 'afareet-unity3d-debug.apk' unity_game/Assets/Afareet/Editor/AfareetBuild.cs
          echo 'Unity Android CI static contract is present.'

  license-preflight:
    name: Unity license preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: static-contract
    steps:
      - name: Validate Unity CI credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail
          if [[ -n "${UNITY_LICENSE:-}" ]]; then
            echo 'Unity license file secret is configured.'
            exit 0
          fi
          if [[ -n "${UNITY_EMAIL:-}" && -n "${UNITY_PASSWORD:-}" && -n "${UNITY_SERIAL:-}" ]]; then
            echo 'Unity serial credentials are configured.'
            exit 0
          fi
          echo '::error::Unity CI credentials are missing. Configure UNITY_LICENSE, or UNITY_EMAIL + UNITY_PASSWORD + UNITY_SERIAL, in repository Actions secrets.'
          exit 1

  tests:
    name: Unity ${{ matrix.testMode }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: license-preflight
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Run ${{ matrix.testMode }} tests
        uses: game-ci/unity-test-runner@v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.testMode }} Test Results

      - name: Upload ${{ matrix.testMode }} test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unity-${{ matrix.testMode }}-results-${{ github.sha }}
          path: artifacts/${{ matrix.testMode }}
          if-no-files-found: warn
          retention-days: 14

  windows-build:
    name: Unity Windows x64 build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Build Windows x64
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: Afareet.Editor.AfareetBuild.BuildWindows

      - name: Verify Windows artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f unity_game/Builds/Windows/afareet-unity3d.exe
          test -s unity_game/Builds/Windows/afareet-unity3d.exe
          echo 'Windows build artifact exists and is non-empty.'

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: afareet-unity3d-windows-${{ github.sha }}
          path: unity_game/Builds/Windows/
          if-no-files-found: error
          retention-days: 14

  android-build:
    name: Unity Android ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Build Android ARM64 debug APK
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: Afareet.Editor.AfareetBuild.BuildAndroid

      - name: Verify APK identity, ARM64 payload and SHA-256
        shell: bash
        run: |
          bash .github/scripts/verify-unity-android-apk.sh \
            unity_game/Builds/Android/afareet-unity3d-debug.apk \
            artifacts/android

      - name: Upload Android APK and inspection evidence
        uses: actions/upload-artifact@v6
        with:
          name: afareet-unity3d-android-${{ github.sha }}
          path: |
            unity_game/Builds/Android/afareet-unity3d-debug.apk
            artifacts/android/
          if-no-files-found: error
          retention-days: 14
