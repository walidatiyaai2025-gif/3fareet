name: Flutter Prototype CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-prototype-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Flutter stable
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter environment
        shell: bash
        run: |
          flutter config --no-analytics
          flutter --version
          flutter precache --android

      - name: Dependencies and static analysis
        shell: bash
        run: |
          flutter pub get
          dart format --output=none lib test
          flutter analyze
          flutter test

      - name: Generate Android scaffold from pinned Flutter template
        shell: bash
        run: ./tool/bootstrap_android.sh

      - name: Build Android debug APK
        shell: bash
        run: flutter build apk --debug

      - name: Build Android release skeleton APK
        shell: bash
        run: flutter build apk --release --dart-define=BUILD_CHANNEL=prototype

      - name: Publish preview APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3fareet-prototype-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
