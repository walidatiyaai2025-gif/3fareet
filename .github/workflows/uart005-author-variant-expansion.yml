name: UART005 Author Variant Expansion

on:
  push:
    branches:
      - agent/p1-production-world-hard-gate
    paths:
      - .github/workflows/uart005-author-variant-expansion.yml

permissions:
  contents: write

concurrency:
  group: uart005-author-variant-expansion
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/p1-production-world-hard-gate
          fetch-depth: 0

      - name: Author distinct facade awning and sign source candidates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/p1-production-world-hard-gate
          git reset --hard origin/agent/p1-production-world-hard-gate
          git fetch origin 5cf93078004fd511c84534a5a1af3c27e3849462
          git show 5cf93078004fd511c84534a5a1af3c27e3849462:tools/android/surface_obj_candidate.py > /tmp/surface_obj_candidate.py

          python - <<'PY'
          from __future__ import annotations
          import math
          import struct
          import zlib
          from pathlib import Path

          root = Path('docs/assets/02_tracks_environments/cairo_street_kit/source')
          root.mkdir(parents=True, exist_ok=True)

          class Mesh:
              def __init__(self, name: str):
                  self.name = name
                  self.vertices: list[tuple[float,float,float]] = []
                  self.faces: list[tuple[int,int,int]] = []

              def v(self, x: float, y: float, z: float) -> int:
                  self.vertices.append((x,y,z))
                  return len(self.vertices)

              def box(self, cx, cy, cz, sx, sy, sz):
                  x0,x1=cx-sx/2,cx+sx/2
                  y0,y1=cy-sy/2,cy+sy/2
                  z0,z1=cz-sz/2,cz+sz/2
                  a,b,c,d,e,f,g,h=[self.v(*p) for p in (
                      (x0,y0,z0),(x1,y0,z0),(x1,y1,z0),(x0,y1,z0),
                      (x0,y0,z1),(x1,y0,z1),(x1,y1,z1),(x0,y1,z1))]
                  self.faces += [
                      (a,b,c),(a,c,d),(e,g,f),(e,h,g),
                      (a,e,f),(a,f,b),(b,f,g),(b,g,c),
                      (c,g,h),(c,h,d),(d,h,e),(d,e,a),
                  ]

              def wedge(self, x0, x1, y0, y1_front, y1_back, z0, z1):
                  # Sloped rectangular canopy volume: front edge lower than wall edge.
                  a=self.v(x0,y0,z0); b=self.v(x1,y0,z0)
                  c=self.v(x1,y1_front,z0); d=self.v(x0,y1_front,z0)
                  e=self.v(x0,y0,z1); f=self.v(x1,y0,z1)
                  g=self.v(x1,y1_back,z1); h=self.v(x0,y1_back,z1)
                  self.faces += [
                      (a,b,c),(a,c,d),(e,g,f),(e,h,g),
                      (a,e,f),(a,f,b),(b,f,g),(b,g,c),
                      (c,g,h),(c,h,d),(d,h,e),(d,e,a),
                  ]

              def write(self, path: Path):
                  lines=[f'# UART-005 authored source variant candidate: {self.name}',f'o {self.name}','s 1']
                  lines += [f'v {x:.5f} {y:.5f} {z:.5f}' for x,y,z in self.vertices]
                  lines += [f'f {a} {b} {c}' for a,b,c in self.faces]
                  path.write_text('\n'.join(lines)+'\n',encoding='utf-8')

          # Facade B: balcony/arched-bay rhythm, deeper cornice, center entrance frame.
          b=Mesh('SM_Env_CairoFacade_B')
          b.box(3.0,2.5,-0.18,6.0,5.0,0.36)             # structural backing
          b.box(0.25,2.5,-0.43,0.25,5.0,0.14); b.box(5.75,2.5,-0.43,0.25,5.0,0.14)
          b.box(3.0,4.78,-0.48,5.7,0.22,0.18)          # cornice
          b.box(3.0,0.30,-0.47,5.8,0.28,0.18)          # plinth
          for x in (1.25,3.0,4.75):
              b.box(x,3.42,-0.44,1.05,1.45,0.14)       # upper window recess plate
              b.box(x,2.62,-0.56,1.35,0.12,0.30)       # balcony slab
              b.box(x,2.92,-0.68,1.28,0.08,0.08)       # rail top
              for rx in (x-0.48,x,x+0.48): b.box(rx,2.78,-0.67,0.06,0.32,0.06)
          b.box(3.0,1.18,-0.46,1.45,2.05,0.16)         # entrance inset
          b.box(2.18,1.18,-0.53,0.13,2.15,0.24); b.box(3.82,1.18,-0.53,0.13,2.15,0.24)
          b.box(3.0,2.20,-0.54,1.78,0.16,0.24)
          b.write(root/'SM_Env_CairoFacade_B.obj')

          # Facade C: storefront-heavy lower tier + vertical upper bays + sign/canopy ledges.
          c=Mesh('SM_Env_CairoFacade_C')
          c.box(3.0,2.5,-0.16,6.0,5.0,0.32)
          c.box(0.22,2.5,-0.40,0.22,5.0,0.16); c.box(5.78,2.5,-0.40,0.22,5.0,0.16)
          c.box(3.0,4.80,-0.46,5.75,0.20,0.20)
          c.box(3.0,2.45,-0.45,5.65,0.16,0.18)         # floor band
          for x in (0.95,2.25,3.75,5.05):
              c.box(x,3.55,-0.43,0.78,1.55,0.14)
              c.box(x,4.38,-0.52,1.02,0.10,0.25)
          # lower storefront frame with center door and two display bays
          for x in (0.35,1.85,3.0,4.15,5.65): c.box(x,1.15,-0.50,0.12,2.10,0.22)
          c.box(3.0,2.18,-0.52,5.55,0.14,0.24)
          c.box(1.10,0.18,-0.48,1.28,0.18,0.18); c.box(4.90,0.18,-0.48,1.28,0.18,0.18)
          c.box(1.10,1.15,-0.46,1.20,1.70,0.12); c.box(4.90,1.15,-0.46,1.20,1.70,0.12)
          c.box(3.0,1.05,-0.46,0.85,1.92,0.12)
          c.box(3.0,2.05,-0.67,2.20,0.18,0.42)         # projecting sign/canopy ledge
          c.write(root/'SM_Env_CairoFacade_C.obj')

          # Awning B: sloped canopy with side frame and front valance.
          a=Mesh('SM_Env_CairoAwning_B')
          a.wedge(0.0,3.0,1.28,1.12,1.38,0.0,1.5)
          a.box(1.5,1.08,0.04,3.0,0.18,0.08)           # front valance
          a.box(0.06,0.68,0.75,0.12,1.36,1.50); a.box(2.94,0.68,0.75,0.12,1.36,1.50)
          a.box(0.06,0.12,1.43,0.12,0.18,0.14); a.box(2.94,0.12,1.43,0.12,0.18,0.14)
          for x in (0.5,1.0,1.5,2.0,2.5): a.box(x,1.20,0.75,0.045,0.10,1.44)
          a.write(root/'SM_Env_CairoAwning_B.obj')

          # Hanging sign: wall bracket, twin braces, framed board and top finial.
          s=Mesh('SM_Prop_CairoSign_A')
          s.box(0.08,0.08,0.0,0.16,0.16,1.20)          # wall arm
          s.box(0.08,-0.22,1.08,0.16,0.70,0.14)        # hanger
          s.box(0.08,-0.52,0.55,0.12,0.12,1.05)        # diagonal-ish lower brace envelope
          s.box(0.08,-0.78,1.22,0.12,0.52,0.12)        # suspension stem
          s.box(0.08,-1.28,1.25,0.12,0.95,1.55)        # sign board core
          s.box(0.08,-0.80,1.25,0.18,0.10,1.68); s.box(0.08,-1.76,1.25,0.18,0.10,1.68)
          s.box(0.08,-1.28,0.43,0.18,0.98,0.10); s.box(0.08,-1.28,2.07,0.18,0.98,0.10)
          s.box(0.08,-0.67,1.25,0.18,0.16,0.16)        # finial
          s.write(root/'SM_Prop_CairoSign_A.obj')

          def chunk(kind: bytes, data: bytes) -> bytes:
              return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)

          def texture(path: Path, base: tuple[int,int,int], accent: tuple[int,int,int], mode: int):
              w=h=64; rows=bytearray()
              for y in range(h):
                  rows.append(0)
                  for x in range(w):
                      stripe = ((x + mode*5) % (12+mode*2)) < 3
                      mortar = y % (14+mode) in (0,1)
                      border = x in (0,1,62,63) or y in (0,1,62,63)
                      rgb = accent if border or mortar or stripe else tuple(min(255,v+(8 if ((x//8+y//8)%2) else 0)) for v in base)
                      rows.extend(rgb)
              payload=(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+
                       chunk(b'IDAT',zlib.compress(bytes(rows),9))+chunk(b'IEND',b''))
              path.write_bytes(payload)

          texture(root/'T_Env_CairoFacade_B_BC.png',(84,58,72),(194,128,62),1)
          texture(root/'T_Env_CairoFacade_C_BC.png',(58,48,76),(44,188,214),2)
          texture(root/'T_Env_CairoAwning_B_BC.png',(112,42,78),(232,164,66),3)
          texture(root/'T_Prop_CairoSign_A_BC.png',(50,38,68),(66,205,226),4)
          PY

          TOOL=/tmp/surface_obj_candidate.py
          ROOT=docs/assets/02_tracks_environments/cairo_street_kit/source

          python "$TOOL" "$ROOT/SM_Env_CairoFacade_B.obj" --material-file SM_Env_CairoFacade_B.mtl --material Facade_B_Surface --write
          python "$TOOL" "$ROOT/SM_Env_CairoFacade_C.obj" --material-file SM_Env_CairoFacade_C.mtl --material Facade_C_Surface --write
          python "$TOOL" "$ROOT/SM_Env_CairoAwning_B.obj" --material-file SM_Env_CairoAwning_B.mtl --material Awning_B_Surface --write
          python "$TOOL" "$ROOT/SM_Prop_CairoSign_A.obj" --material-file SM_Prop_CairoSign_A.mtl --material Sign_Surface --write

          cat > "$ROOT/SM_Env_CairoFacade_B.mtl" <<'EOF'
          newmtl Facade_B_Surface
          Ka 0.070000 0.045000 0.055000
          Kd 0.420000 0.260000 0.300000
          Ks 0.120000 0.100000 0.110000
          Ns 22.000000
          illum 2
          map_Kd T_Env_CairoFacade_B_BC.png
          EOF
          cat > "$ROOT/SM_Env_CairoFacade_C.mtl" <<'EOF'
          newmtl Facade_C_Surface
          Ka 0.045000 0.040000 0.060000
          Kd 0.270000 0.235000 0.360000
          Ks 0.130000 0.140000 0.180000
          Ns 26.000000
          illum 2
          map_Kd T_Env_CairoFacade_C_BC.png
          EOF
          cat > "$ROOT/SM_Env_CairoAwning_B.mtl" <<'EOF'
          newmtl Awning_B_Surface
          Ka 0.060000 0.025000 0.040000
          Kd 0.520000 0.180000 0.310000
          Ks 0.080000 0.070000 0.080000
          Ns 16.000000
          illum 2
          map_Kd T_Env_CairoAwning_B_BC.png
          EOF
          cat > "$ROOT/SM_Prop_CairoSign_A.mtl" <<'EOF'
          newmtl Sign_Surface
          Ka 0.025000 0.035000 0.050000
          Kd 0.140000 0.390000 0.460000
          Ks 0.280000 0.400000 0.440000
          Ns 58.000000
          illum 2
          map_Kd T_Prop_CairoSign_A_BC.png
          EOF

          python "$TOOL" "$ROOT/SM_Env_CairoFacade_B.obj" --material-file SM_Env_CairoFacade_B.mtl --material Facade_B_Surface --check
          python "$TOOL" "$ROOT/SM_Env_CairoFacade_C.obj" --material-file SM_Env_CairoFacade_C.mtl --material Facade_C_Surface --check
          python "$TOOL" "$ROOT/SM_Env_CairoAwning_B.obj" --material-file SM_Env_CairoAwning_B.mtl --material Awning_B_Surface --check
          python "$TOOL" "$ROOT/SM_Prop_CairoSign_A.obj" --material-file SM_Prop_CairoSign_A.mtl --material Sign_Surface --check

          python - <<'PY'
          from pathlib import Path
          root=Path('docs/assets/02_tracks_environments/cairo_street_kit/source')
          floors={
              'SM_Env_CairoFacade_B.obj':(128,200),
              'SM_Env_CairoFacade_C.obj':(128,200),
              'SM_Env_CairoAwning_B.obj':(64,96),
              'SM_Prop_CairoSign_A.obj':(72,108),
          }
          digests=[]
          import hashlib
          for name,(min_v,min_t) in floors.items():
              text=(root/name).read_text(encoding='utf-8')
              v=sum(line.startswith('v ') for line in text.splitlines())
              t=sum(max(0,len(line.split())-3) for line in text.splitlines() if line.startswith('f '))
              if v < min_v or t < min_t:
                  raise SystemExit(f'{name}: anti-blockout floor failed {v}v/{t}t expected>={min_v}/{min_t}')
              digests.append(hashlib.sha256((root/name).read_bytes()).hexdigest())
              print(f'AFAREET_UART005_VARIANT_SOURCE_OK model={name} vertices={v} triangles={t}')
          if len(set(digests)) != len(digests):
              raise SystemExit('UART-005 variant sources are not distinct')
          PY
          git diff --check

      - name: Commit variant source assets and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "3Fareet UART-005 Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/uart005-author-variant-expansion.yml
          git add docs/assets/02_tracks_environments/cairo_street_kit/source
          git status --short
          git diff --cached --check
          git commit -m "UART-005: add Cairo facade and dressing source variants"
          git push origin HEAD:agent/p1-production-world-hard-gate
