name: Post-P1 Live AI Power-Up Bridge Contract

on:
  pull_request:
    paths:
      - 'unity_game/Assets/Afareet/Scripts/Race/AiRacer.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/RaceDirector.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpRuntimeDefaults.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpRuntimeDefaults.cs.meta'
      - 'unity_game/Assets/Afareet/Scripts/Race/AiPowerUpLiveSnapshotBuilder.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/AiPowerUpLiveSnapshotBuilder.cs.meta'
      - 'tools/android/contracts/PowerUpRuntimeCompile.csproj'
      - 'tools/android/contracts/LiveAiPowerUpBridgeContractRunner.csproj'
      - 'tools/android/contracts/LiveAiPowerUpBridgeContractRunner.cs'
      - 'tools/android/tests/test_postp1_live_ai_powerup_bridge_contract.py'
      - '.github/workflows/postp1-live-ai-powerup-bridge-contract.yml'
  push:
    branches:
      - main
      - agent/p1-remediation-convergence
    paths:
      - 'unity_game/Assets/Afareet/Scripts/Race/AiRacer.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/RaceDirector.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpRuntimeDefaults.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpRuntimeDefaults.cs.meta'
      - 'unity_game/Assets/Afareet/Scripts/Race/AiPowerUpLiveSnapshotBuilder.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/AiPowerUpLiveSnapshotBuilder.cs.meta'
      - 'tools/android/contracts/PowerUpRuntimeCompile.csproj'
      - 'tools/android/contracts/LiveAiPowerUpBridgeContractRunner.csproj'
      - 'tools/android/contracts/LiveAiPowerUpBridgeContractRunner.cs'
      - 'tools/android/tests/test_postp1_live_ai_powerup_bridge_contract.py'
      - '.github/workflows/postp1-live-ai-powerup-bridge-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ai-powerup-bridge-contract:
    name: Live AI power-up bridge compile + behavior contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile pure C# power-up runtime dependencies
        run: dotnet build tools/android/contracts/PowerUpRuntimeCompile.csproj --configuration Release --nologo

      - name: Run live AI bridge behavior contract
        run: dotnet run --project tools/android/contracts/LiveAiPowerUpBridgeContractRunner.csproj --configuration Release --nologo

      - name: Run live AI bridge source contracts
        run: python3 tools/android/tests/test_postp1_live_ai_powerup_bridge_contract.py
