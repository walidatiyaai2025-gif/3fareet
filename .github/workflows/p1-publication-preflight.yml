name: P1 Publication Preflight

on:
  pull_request:
    paths:
      - 'tools/android/verify_p1_release_publication.py'
      - 'tools/android/tests/test_verify_p1_release_publication.py'
      - '.github/workflows/p1-publication-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-publication-preflight:
    name: P1 lineage-bound publication contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python syntax and CLI contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/android/p1_lineage_gate_readiness.py \
            tools/android/verify_p1_device_review_bundle.py \
            tools/android/verify_p1_release_publication.py
          python3 tools/android/verify_p1_release_publication.py --help >/dev/null

      - name: Execute P1 publication-preflight regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/android/tests -p 'test_verify_p1_release_publication.py' -v
