name: Post-P1 Power-Up Runtime Contract

on:
  pull_request:
    paths:
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpRaceRuntime.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpRaceRuntime.cs.meta'
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpEffectState.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpPresentationHooks.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/AiPowerUpUsagePolicy.cs'
      - 'unity_game/Assets/Afareet/Tests/EditMode/Race/PowerUpRaceRuntimeTests.cs'
      - 'unity_game/Assets/Afareet/Tests/EditMode/Race/PowerUpRaceRuntimeTests.cs.meta'
      - 'tools/android/contracts/PowerUpRuntimeCompile.csproj'
      - 'tools/android/contracts/PowerUpRuntimeContractRunner.csproj'
      - 'tools/android/contracts/PowerUpRuntimeContractRunner.cs'
      - 'tools/android/tests/test_postp1_powerup_runtime_contract.py'
      - '.github/workflows/postp1-powerup-runtime-contract.yml'
  push:
    branches:
      - main
      - agent/p1-remediation-convergence
    paths:
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpRaceRuntime.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpRaceRuntime.cs.meta'
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpEffectState.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpPresentationHooks.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/AiPowerUpUsagePolicy.cs'
      - 'unity_game/Assets/Afareet/Tests/EditMode/Race/PowerUpRaceRuntimeTests.cs'
      - 'unity_game/Assets/Afareet/Tests/EditMode/Race/PowerUpRaceRuntimeTests.cs.meta'
      - 'tools/android/contracts/PowerUpRuntimeCompile.csproj'
      - 'tools/android/contracts/PowerUpRuntimeContractRunner.csproj'
      - 'tools/android/contracts/PowerUpRuntimeContractRunner.cs'
      - 'tools/android/tests/test_postp1_powerup_runtime_contract.py'
      - '.github/workflows/postp1-powerup-runtime-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contract:
    name: Power-up runtime compile + behavior contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile pure C# runtime contract
        run: dotnet build tools/android/contracts/PowerUpRuntimeCompile.csproj --configuration Release --nologo

      - name: Run executable runtime behavior contract
        run: dotnet run --project tools/android/contracts/PowerUpRuntimeContractRunner.csproj --configuration Release --nologo

      - name: Run runtime source contract tests
        run: python3 tools/android/tests/test_postp1_powerup_runtime_contract.py
