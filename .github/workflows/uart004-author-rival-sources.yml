name: UART004 Author Rival Sources

on:
  push:
    branches:
      - agent/uart004-authored-rivals-hard-gate
    paths:
      - .github/workflows/uart004-author-rival-sources.yml

permissions:
  contents: write

concurrency:
  group: uart004-author-rival-sources
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/uart004-authored-rivals-hard-gate
          fetch-depth: 0

      - name: Author static OBJ MTL PNG source candidates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/uart004-authored-rivals-hard-gate
          git reset --hard origin/agent/uart004-authored-rivals-hard-gate

          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import math
          import struct
          import zlib
          from pathlib import Path

          repo = Path('.')
          profile_path = repo / 'docs/assets/01_vehicles/rival_cars_production/RIVAL_DESIGN_PROFILES.json'
          pack = json.loads(profile_path.read_text(encoding='utf-8'))
          root = repo / 'unity_game/Assets/Afareet/ArtSource/Vehicles/Rivals'
          root.mkdir(parents=True, exist_ok=True)

          source_names = (
              'Rival_01_WedgeCoupe',
              'Rival_02_FastbackMuscle',
              'Rival_03_CompactPrototype',
          )
          min_tri = (1800, 800, 350)
          max_tri = (16000, 8000, 4000)

          def hex_rgb(value: str) -> tuple[int,int,int]:
              value = value.lstrip('#')
              return tuple(int(value[i:i+2], 16) for i in (0,2,4))

          def png_chunk(kind: bytes, data: bytes) -> bytes:
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)

          def write_texture(path: Path, primary: tuple[int,int,int], secondary: tuple[int,int,int], variant: int) -> None:
              w = h = 128
              rows = bytearray()
              dark = tuple(max(0, c // 4) for c in primary)
              glass = (28, 42, 54)
              for y in range(h):
                  rows.append(0)
                  for x in range(w):
                      stripe = ((x + variant * 9) % 32) < (6 + variant)
                      panel = (y % 32) in (0,1) or (x % 32) in (0,1)
                      glass_band = 42 <= y < 64
                      if panel:
                          rgb = dark
                      elif glass_band and 18 < x < 110:
                          rgb = glass
                      elif stripe:
                          rgb = secondary
                      else:
                          checker = ((x // 16) + (y // 16)) % 2
                          rgb = tuple(min(255, c + (8 if checker else 0)) for c in primary)
                      rows.extend(rgb)
              payload = (
                  b'\x89PNG\r\n\x1a\n'
                  + png_chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                  + png_chunk(b'IDAT', zlib.compress(bytes(rows), 9))
                  + png_chunk(b'IEND', b'')
              )
              path.write_bytes(payload)

          def norm(v):
              x,y,z=v
              length=math.sqrt(x*x+y*y+z*z)
              if length < 1e-9: return (0.0,1.0,0.0)
              return (x/length,y/length,z/length)

          def cross(a,b):
              return (a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0])

          def sub(a,b):
              return (a[0]-b[0],a[1]-b[1],a[2]-b[2])

          class MeshBuilder:
              def __init__(self):
                  self.vertices=[]
                  self.lods=[]

              def add_vertex(self,p):
                  self.vertices.append(p)
                  return len(self.vertices)

              def loft(self, z0,z1, segments, radial, width, height, center_y, taper, material):
                  rings=[]
                  for i in range(segments+1):
                      u=i/segments
                      z=z0+(z1-z0)*u
                      nose=min(1.0, u/max(taper,1e-4))
                      tail=min(1.0, (1-u)/max(taper,1e-4))
                      envelope=max(0.23, min(nose,tail))
                      ring=[]
                      for r in range(radial):
                          a=2*math.pi*r/radial
                          x=0.5*width*envelope*math.cos(a)
                          sy=math.sin(a)
                          y=center_y + 0.5*height*(0.72*sy + 0.28*max(sy, -0.3))
                          ring.append(self.add_vertex((x,y,z)))
                      rings.append(ring)
                  faces=[]
                  for i in range(segments):
                      for r in range(radial):
                          q=(r+1)%radial
                          a,b=rings[i][r],rings[i][q]
                          c,d=rings[i+1][q],rings[i+1][r]
                          faces.extend(((a,b,c),(a,c,d)))
                  return material, faces

              def wheel(self, cx,cy,cz, radius, width, segments, material):
                  left=[]; right=[]
                  x0=cx-width/2; x1=cx+width/2
                  for i in range(segments):
                      a=2*math.pi*i/segments
                      y=cy+radius*math.sin(a)
                      z=cz+radius*math.cos(a)
                      left.append(self.add_vertex((x0,y,z)))
                      right.append(self.add_vertex((x1,y,z)))
                  lc=self.add_vertex((x0,cy,cz)); rc=self.add_vertex((x1,cy,cz))
                  faces=[]
                  for i in range(segments):
                      j=(i+1)%segments
                      faces.extend(((left[i],left[j],right[j]),(left[i],right[j],right[i])))
                      faces.append((lc,left[j],left[i]))
                      faces.append((rc,right[i],right[j]))
                  return material, faces

              def box(self, cx,cy,cz,sx,sy,sz,material):
                  x0,x1=cx-sx/2,cx+sx/2; y0,y1=cy-sy/2,cy+sy/2; z0,z1=cz-sz/2,cz+sz/2
                  v=[self.add_vertex(p) for p in (
                      (x0,y0,z0),(x1,y0,z0),(x1,y1,z0),(x0,y1,z0),
                      (x0,y0,z1),(x1,y0,z1),(x1,y1,z1),(x0,y1,z1))]
                  a,b,c,d,e,f,g,h=v
                  faces=((a,b,c),(a,c,d),(e,g,f),(e,h,g),(a,e,f),(a,f,b),
                         (b,f,g),(b,g,c),(c,g,h),(c,h,d),(d,h,e),(d,e,a))
                  return material, list(faces)

          def build_variant(variant_index, variant, source_name):
              builder=MeshBuilder()
              lod_records=[]
              length=float(variant['length']); width=float(variant['width'])
              body_h=float(variant['bodyHeight']); roof_h=float(variant['roofHeight'])
              wheel_r=float(variant['wheelRadius']); roof_factor=float(variant['roofWidthFactor'])
              haunch=float(variant['haunchFlare']); wing=float(variant['rearWingWidth'])

              for lod, topo in enumerate(pack['lodTopology']):
                  s=int(topo['longitudinalSegments']); r=int(topo['bodyRadialSegments']); w=int(topo['wheelSegments'])
                  groups=[]
                  z0=-length/2; z1=length/2
                  body_center=wheel_r*0.82 + body_h*0.46
                  groups.append(builder.loft(z0,z1,s,r,width+2*haunch,body_h,body_center,0.17,'BodyPaint'))

                  cs=max(6,s//3); cr=max(6,r//2)
                  if variant_index == 0:
                      cabin_z0,cabin_z1=-0.62*length/4,0.80*length/4
                  elif variant_index == 1:
                      cabin_z0,cabin_z1=-0.92*length/4,0.72*length/4
                  else:
                      cabin_z0,cabin_z1=-0.48*length/4,0.58*length/4
                  cabin_center=body_center+body_h*0.42+roof_h*0.36
                  groups.append(builder.loft(cabin_z0,cabin_z1,cs,cr,width*roof_factor,roof_h,cabin_center,0.28,'Glass'))

                  axle_z=length*0.31
                  wheel_width=max(0.20,width*0.12)
                  wheel_x=width*0.47
                  for x in (-wheel_x,wheel_x):
                      for z in (-axle_z,axle_z):
                          groups.append(builder.wheel(x,wheel_r,z,wheel_r,wheel_width,w,'Tire'))

                  box_count=7 if variant_index==0 else 9
                  aero=[]
                  # front splitter, rear diffuser, wing, central spine, side pods, plus variant-specific accents
                  specs=[
                      (0, wheel_r*0.42, z1-0.05, width*0.92, 0.10, 0.28),
                      (0, wheel_r*0.48, z0+0.08, width*0.88, 0.12, 0.30),
                      (0, body_center+body_h*0.78, z0+0.22, wing, 0.10, 0.24),
                      (0, body_center+body_h*0.84, -0.05, width*0.09, 0.12, length*0.32),
                      (-width*0.48, body_center, 0.05, 0.12, 0.18, length*0.36),
                      ( width*0.48, body_center, 0.05, 0.12, 0.18, length*0.36),
                      (0, body_center+body_h*0.15, z1-0.42, width*0.56, 0.13, 0.16),
                      (0, body_center+body_h*0.24, z0+0.52, width*0.52, 0.14, 0.18),
                      (0, body_center+body_h*0.62, z0+0.48, width*0.12, 0.30, 0.34),
                  ]
                  for spec in specs[:box_count]:
                      groups.append(builder.box(*spec,'Accent'))

                  face_count=sum(len(faces) for _,faces in groups)
                  if not (min_tri[lod] <= face_count <= max_tri[lod]):
                      raise SystemExit(f'{source_name} LOD{lod} triangle count {face_count} outside {min_tri[lod]}..{max_tri[lod]}')
                  lod_records.append((lod, groups, face_count))

              # Build shared UV0 and authored normals for all vertices.
              normals=[[0.0,0.0,0.0] for _ in builder.vertices]
              all_faces=[]
              for _,groups,_ in lod_records:
                  for _,faces in groups: all_faces.extend(faces)
              for a,b,c in all_faces:
                  pa,pb,pc=builder.vertices[a-1],builder.vertices[b-1],builder.vertices[c-1]
                  n=cross(sub(pb,pa),sub(pc,pa))
                  for idx in (a,b,c):
                      normals[idx-1][0]+=n[0]; normals[idx-1][1]+=n[1]; normals[idx-1][2]+=n[2]
              normals=[norm(tuple(n)) for n in normals]

              mtl_name=source_name+'.mtl'
              texture_name=f'T_Rival_{variant_index+1:02d}_BC.png'
              obj=[]
              obj.append(f'# UART-004 static authored source candidate: {source_name}')
              obj.append('# Source acceptance remains blocked pending licensed Unity import/prefab bind/render review.')
              obj.append(f'mtllib {mtl_name}')
              for x,y,z in builder.vertices: obj.append(f'v {x:.6f} {y:.6f} {z:.6f}')
              for x,y,z in builder.vertices:
                  u=max(0.0,min(1.0,x/(width*1.35)+0.5)); v=max(0.0,min(1.0,z/(length*1.15)+0.5))
                  obj.append(f'vt {u:.6f} {v:.6f}')
              for x,y,z in normals: obj.append(f'vn {x:.6f} {y:.6f} {z:.6f}')
              for lod,groups,face_count in lod_records:
                  obj.append(f'o {source_name}_LOD{lod}')
                  obj.append('s 1')
                  for material,faces in groups:
                      obj.append(f'usemtl {material}')
                      for a,b,c in faces:
                          obj.append(f'f {a}/{a}/{a} {b}/{b}/{b} {c}/{c}/{c}')
              obj_path=root/(source_name+'.obj')
              obj_path.write_text('\n'.join(obj)+'\n',encoding='utf-8')

              primary=hex_rgb(variant['primary']); secondary=hex_rgb(variant['secondary'])
              write_texture(root/texture_name,primary,secondary,variant_index)
              kd=tuple(c/255 for c in primary); accent=tuple(c/255 for c in secondary)
              mtl=f'''# UART-004 source material candidate\nnewmtl BodyPaint\nKa 0.050000 0.050000 0.050000\nKd {kd[0]:.6f} {kd[1]:.6f} {kd[2]:.6f}\nKs 0.520000 0.520000 0.520000\nNs 92.000000\nillum 2\nmap_Kd {texture_name}\n\nnewmtl Glass\nKa 0.020000 0.030000 0.040000\nKd 0.080000 0.140000 0.180000\nKs 0.650000 0.650000 0.650000\nNs 120.000000\nillum 2\nmap_Kd {texture_name}\n\nnewmtl Tire\nKa 0.010000 0.010000 0.010000\nKd 0.035000 0.035000 0.040000\nKs 0.080000 0.080000 0.080000\nNs 18.000000\nillum 2\nmap_Kd {texture_name}\n\nnewmtl Accent\nKa 0.040000 0.040000 0.040000\nKd {accent[0]:.6f} {accent[1]:.6f} {accent[2]:.6f}\nKs 0.450000 0.450000 0.450000\nNs 74.000000\nillum 2\nmap_Kd {texture_name}\n'''
              (root/mtl_name).write_text(mtl,encoding='utf-8')

              digest=hashlib.sha256(obj_path.read_bytes()).hexdigest()
              return {
                  'variant': variant_index+1,
                  'id': variant['id'],
                  'sourceAssetId': f'Assets/Afareet/ArtSource/Vehicles/Rivals/{source_name}.obj',
                  'material': mtl_name,
                  'texture': texture_name,
                  'lodTriangles': [rec[2] for rec in lod_records],
                  'sha256': digest,
                  'sourceState': 'STATIC_SOURCE_CANDIDATE_PENDING_UNITY_IMPORT_BIND_AND_VISUAL_ACCEPTANCE'
              }

          sources=[]
          for idx,(variant,name) in enumerate(zip(pack['variants'],source_names)):
              sources.append(build_variant(idx,variant,name))

          manifest={
              'taskId':'UART-004',
              'reviewState':'BLOCKED',
              'sourceDeliveryProgress':'3/3',
              'productionPrefabsBound':'0/3',
              'licensedUnityImportVerified':False,
              'runtimeVisualVerified':False,
              'sources':sources,
              'acceptancePending':[
                  'licensed Unity import and stable tracked .meta GUIDs',
                  'create/bind three production prefabs with exactly three LODs each',
                  'licensed Unity production validator/render/build proof',
                  'exact Android in-race rival screenshots/video',
                  'owner/Art Director visual acceptance'
              ]
          }
          manifest_path=repo/'docs/assets/01_vehicles/rival_cars_production/SOURCE_CANDIDATES.json'
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')

          readme=repo/'docs/assets/01_vehicles/rival_cars_production/README.md'
          text=readme.read_text(encoding='utf-8')
          old='''## Repository inventory at the current remediation head\n\nThe tracked `rival_cars_production` handoff currently contains this README and `RIVAL_DESIGN_PROFILES.json`; it does **not** contain the three externally authored production model files. Likewise, the required Rival production prefabs are not yet present in the Unity Resources path. This is an explicit art-delivery dependency, not a successful visual implementation claim.\n'''
          new='''## Repository inventory at the current remediation head\n\nThree distinct static OBJ source **candidates** now exist under `Assets/Afareet/ArtSource/Vehicles/Rivals/`, each carrying LOD0/LOD1/LOD2 geometry, UV0, explicit normals, MTL material mappings and a tracked PNG base-color texture. Their exact source inventory and hashes are recorded in `SOURCE_CANDIDATES.json`.\n\nThese source files are **not accepted Production Art yet**. The required Rival production prefabs are still absent, the sources have not been imported/bound by a licensed Unity Editor on the exact candidate, stable Unity source GUID/dependency provenance has not been captured, and no Android runtime visual proof or owner acceptance exists.\n'''
          if old not in text:
              raise SystemExit('README inventory paragraph changed; refusing blind rewrite')
          readme.write_text(text.replace(old,new),encoding='utf-8')
          PY

          cat > tools/android/tests/test_uart004_static_source_candidates.py <<'PYTEST'
          import hashlib
          import json
          import unittest
          from pathlib import Path

          REPO_ROOT = Path(__file__).resolve().parents[3]
          MANIFEST = REPO_ROOT / "docs/assets/01_vehicles/rival_cars_production/SOURCE_CANDIDATES.json"
          ASSET_ROOT = REPO_ROOT / "unity_game/Assets/Afareet/ArtSource/Vehicles/Rivals"
          BANDS = ((1800, 16000), (800, 8000), (350, 4000))

          def parse_obj(path: Path):
              lines = path.read_text(encoding="utf-8").splitlines()
              vertices = [line for line in lines if line.startswith("v ")]
              uvs = [line for line in lines if line.startswith("vt ")]
              normals = [line for line in lines if line.startswith("vn ")]
              lod_faces = {0: [], 1: [], 2: []}
              active = None
              for line in lines:
                  if line.startswith("o "):
                      active = next((lod for lod in range(3) if line.endswith(f"_LOD{lod}")), None)
                  elif line.startswith("f ") and active is not None:
                      lod_faces[active].append(line)
              return lines, vertices, uvs, normals, lod_faces

          class Uart004StaticSourceCandidateTests(unittest.TestCase):
              def test_three_distinct_static_sources_exist_under_assets_and_remain_unaccepted(self):
                  manifest = json.loads(MANIFEST.read_text(encoding="utf-8"))
                  self.assertEqual("BLOCKED", manifest["reviewState"])
                  self.assertEqual("3/3", manifest["sourceDeliveryProgress"])
                  self.assertEqual("0/3", manifest["productionPrefabsBound"])
                  self.assertFalse(manifest["licensedUnityImportVerified"])
                  self.assertFalse(manifest["runtimeVisualVerified"])
                  self.assertEqual(3, len(manifest["sources"]))
                  paths = [entry["sourceAssetId"] for entry in manifest["sources"]]
                  self.assertEqual(3, len(set(paths)))
                  for source in paths:
                      self.assertTrue(source.startswith("Assets/Afareet/ArtSource/Vehicles/Rivals/"), source)
                      self.assertTrue(source.endswith(".obj"), source)
                      self.assertNotIn("/Generated/", source)

              def test_all_lods_have_uv_normals_material_texture_and_budgeted_topology(self):
                  manifest = json.loads(MANIFEST.read_text(encoding="utf-8"))
                  digests = set()
                  for entry in manifest["sources"]:
                      obj = REPO_ROOT / "unity_game" / entry["sourceAssetId"]
                      mtl = obj.parent / entry["material"]
                      texture = obj.parent / entry["texture"]
                      self.assertTrue(obj.is_file(), obj)
                      self.assertTrue(mtl.is_file(), mtl)
                      self.assertTrue(texture.is_file(), texture)
                      self.assertEqual(bytes((137,80,78,71,13,10,26,10)), texture.read_bytes()[:8])
                      digest = hashlib.sha256(obj.read_bytes()).hexdigest()
                      self.assertEqual(entry["sha256"], digest)
                      digests.add(digest)

                      lines, vertices, uvs, normals, lod_faces = parse_obj(obj)
                      self.assertEqual(len(vertices), len(uvs), obj.name)
                      self.assertEqual(len(vertices), len(normals), obj.name)
                      self.assertIn(f"mtllib {entry['material']}", lines)
                      mtl_text = mtl.read_text(encoding="utf-8")
                      self.assertGreaterEqual(mtl_text.count(f"map_Kd {entry['texture']}"), 4)

                      measured = []
                      for lod in range(3):
                          faces = lod_faces[lod]
                          measured.append(len(faces))
                          low, high = BANDS[lod]
                          self.assertGreaterEqual(len(faces), low, (obj.name, lod, len(faces)))
                          self.assertLessEqual(len(faces), high, (obj.name, lod, len(faces)))
                          for face in faces:
                              for token in face.split()[1:]:
                                  fields = token.split("/")
                                  self.assertEqual(3, len(fields), token)
                                  self.assertTrue(all(fields), token)
                                  vi, ti, ni = map(int, fields)
                                  self.assertGreaterEqual(vi, 1); self.assertLessEqual(vi, len(vertices))
                                  self.assertGreaterEqual(ti, 1); self.assertLessEqual(ti, len(uvs))
                                  self.assertGreaterEqual(ni, 1); self.assertLessEqual(ni, len(normals))
                      self.assertEqual(entry["lodTriangles"], measured)
                  self.assertEqual(3, len(digests))

          if __name__ == "__main__":
              unittest.main()
          PYTEST

          python -m py_compile tools/android/tests/test_uart004_static_source_candidates.py
          python -m unittest tools.android.tests.test_uart004_rival_mesh_budget tools.android.tests.test_uart004_static_source_candidates
          python -m json.tool docs/assets/01_vehicles/rival_cars_production/SOURCE_CANDIDATES.json >/dev/null
          git diff --check

      - name: Commit static rival source delivery and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "3Fareet UART-004 Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/uart004-author-rival-sources.yml
          git add \
            docs/assets/01_vehicles/rival_cars_production/README.md \
            docs/assets/01_vehicles/rival_cars_production/SOURCE_CANDIDATES.json \
            unity_game/Assets/Afareet/ArtSource/Vehicles/Rivals \
            tools/android/tests/test_uart004_static_source_candidates.py
          git status --short
          git diff --cached --check
          git commit -m "UART-004: add three static rival source candidates"
          git push origin HEAD:agent/uart004-authored-rivals-hard-gate
