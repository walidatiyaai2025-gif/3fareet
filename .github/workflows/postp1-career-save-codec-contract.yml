name: Post-P1 Career Save Codec Contract

on:
  pull_request:
    paths:
      - 'unity_game/Assets/Afareet/Scripts/Progression/**'
      - 'unity_game/Assets/Afareet/Tests/EditMode/Progression/**'
      - 'tools/android/contracts/CareerFoundationCompile.csproj'
      - 'tools/android/contracts/CareerSaveCodecContractRunner.cs'
      - 'tools/android/contracts/CareerSaveCodecContractRunner.csproj'
      - 'tools/android/tests/test_postp1_career_save_codec_contract.py'
      - '.github/workflows/postp1-career-save-codec-contract.yml'
  push:
    paths:
      - 'unity_game/Assets/Afareet/Scripts/Progression/**'
      - 'unity_game/Assets/Afareet/Tests/EditMode/Progression/**'
      - 'tools/android/contracts/CareerFoundationCompile.csproj'
      - 'tools/android/contracts/CareerSaveCodecContractRunner.cs'
      - 'tools/android/contracts/CareerSaveCodecContractRunner.csproj'
      - 'tools/android/tests/test_postp1_career_save_codec_contract.py'
      - '.github/workflows/postp1-career-save-codec-contract.yml'
  workflow_dispatch:

jobs:
  career-save-codec-contract:
    name: Career save codec compile + behavior contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile pure C# Career foundation + progression + save codec
        run: dotnet build tools/android/contracts/CareerFoundationCompile.csproj --configuration Release --nologo

      - name: Run Career save codec behavior contract
        run: dotnet run --project tools/android/contracts/CareerSaveCodecContractRunner.csproj --configuration Release

      - name: Run Career save codec source contracts
        run: python3 tools/android/tests/test_postp1_career_save_codec_contract.py
