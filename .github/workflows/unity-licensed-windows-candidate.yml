name: Unity Licensed Windows Candidate

on:
  pull_request:
    paths:
      - '.github/workflows/unity-licensed-windows-candidate.yml'
      - 'docs/qa/LICENSED_WINDOWS_GITHUB_RUNNER.md'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact 40-character SHA expected at agent/unblock-final-5'
        required: true
        type: string
        default: '61364edf05ce72fd1aaf98ecd6ce28f4d4a12a55'
      unity_path:
        description: 'Licensed Unity 6000.5.8f1 executable on the self-hosted Windows runner'
        required: true
        type: string
        default: 'C:\Program Files\Unity\Hub\Editor\6000.5.8f1\Editor\Unity.exe'

permissions:
  contents: read

concurrency:
  group: unity-licensed-windows-candidate
  cancel-in-progress: false

jobs:
  static-contract:
    name: Licensed Windows workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v5

      - name: Validate fail-closed workflow contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/unity-licensed-windows-candidate.yml'
          grep -Fq "ref: agent/unblock-final-5" "$workflow"
          grep -Fq "runs-on: [self-hosted, Windows, X64]" "$workflow"
          grep -Fq "expected_sha" "$workflow"
          grep -Fq "run_local_candidate_windows.ps1" "$workflow"
          grep -Fq "persist-credentials: false" "$workflow"
          grep -Fq "actions/upload-artifact@v6" "$workflow"
          echo 'Licensed Windows workflow static contract is present.'

  licensed-candidate:
    name: Licensed Unity 6000.5.8f1 exact-SHA candidate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: static-contract
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 150

    steps:
      - name: Checkout canonical Unity production branch
        uses: actions/checkout@v5
        with:
          ref: agent/unblock-final-5
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: false

      - name: Pin checkout to requested exact SHA
        id: pin
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $expected = ([string]$env:EXPECTED_SHA).Trim().ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{40}$') {
            throw "expected_sha must be a full 40-character lowercase/uppercase Git SHA; found '$expected'"
          }

          $actual = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve checkout HEAD to a full Git SHA.'
          }
          if ($actual -ne $expected) {
            throw "Canonical branch moved or wrong SHA was requested. expected=$expected actual=$actual"
          }

          $dirty = @(& git status --porcelain)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect Git working tree.'
          }
          if ($dirty.Count -gt 0) {
            $dirty | ForEach-Object { Write-Warning "CHECKOUT_DIRTY $_" }
            throw 'Self-hosted candidate must start from a clean exact checkout.'
          }

          "sha=$actual" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "AFAREET_SELF_HOSTED_SHA_PIN_OK gitSha=$actual branch=agent/unblock-final-5"

      - name: Validate licensed Unity executable and candidate entry point
        shell: pwsh
        env:
          UNITY_EXE: ${{ inputs.unity_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          if (-not (Test-Path -LiteralPath $env:UNITY_EXE -PathType Leaf)) {
            throw "Unity executable not found at configured path: $env:UNITY_EXE"
          }
          $runner = Join-Path $env:GITHUB_WORKSPACE 'tools\android\run_local_candidate_windows.ps1'
          if (-not (Test-Path -LiteralPath $runner -PathType Leaf)) {
            throw "Canonical production branch is missing candidate runner: $runner"
          }
          Write-Host 'AFAREET_SELF_HOSTED_UNITY_PREFLIGHT_OK unityVersion=6000.5.8f1'

      - name: Run licensed Unity tests, Android build and candidate verifier
        shell: pwsh
        env:
          UNITY_EXE: ${{ inputs.unity_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\android\run_local_candidate_windows.ps1 `
            -UnityPath $env:UNITY_EXE `
            -RepoRoot $env:GITHUB_WORKSPACE

      - name: Validate candidate manifest remains device-gated
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts\local-candidate-manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Candidate manifest missing: $manifestPath"
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$manifest.gitSha -ne [string]$env:EXPECTED_SHA) {
            throw "Candidate manifest SHA mismatch. expected=$env:EXPECTED_SHA actual=$($manifest.gitSha)"
          }
          if ($manifest.releaseEvidenceEligible -isnot [bool] -or -not $manifest.releaseEvidenceEligible) {
            throw 'releaseEvidenceEligible must be JSON boolean true.'
          }
          if ($manifest.readyForDeviceEvidence -isnot [bool] -or -not $manifest.readyForDeviceEvidence) {
            throw 'readyForDeviceEvidence must be JSON boolean true.'
          }
          if ($manifest.verified -isnot [bool] -or $manifest.verified) {
            throw 'verified must remain JSON boolean false before physical-device evidence.'
          }
          if ([string]$manifest.verdict -ne 'READY_FOR_PHYSICAL_DEVICE_EVIDENCE') {
            throw "Unexpected candidate verdict: $($manifest.verdict)"
          }
          Write-Host "AFAREET_SELF_HOSTED_CANDIDATE_READY gitSha=$($manifest.gitSha) apkSha256=$($manifest.apk.sha256) verified=false"

      - name: Upload exact-SHA licensed candidate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: afareet-licensed-windows-${{ steps.pin.outputs.sha || 'failed-before-sha-pin' }}
          path: |
            artifacts/local-candidate-manifest.json
            artifacts/unity-local-tests/
            artifacts/android-local/
            artifacts/logs/
          if-no-files-found: warn
          retention-days: 14
