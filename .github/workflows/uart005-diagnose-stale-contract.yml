name: UART005 Diagnose Stale Contract

on:
  push:
    branches:
      - agent/p1-production-world-hard-gate
    paths:
      - .github/workflows/uart005-diagnose-stale-contract.yml

permissions:
  contents: write

concurrency:
  group: uart005-diagnose-stale-contract
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-production-world-hard-gate
          fetch-depth: 0
      - name: Capture full Android unit-test failure
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tools/android/tests -p 'test_*.py' -v > /tmp/uart005-unittest.log 2>&1
          rc=$?
          set -e
          {
            echo "exit_code=$rc"
            echo '=== failure/error summary ==='
            grep -nE '^(FAIL|ERROR):|^FAILED \(|^Traceback \(most recent call last\):|AssertionError' /tmp/uart005-unittest.log || true
            echo '=== tail ==='
            tail -220 /tmp/uart005-unittest.log
          } > /tmp/UART005_QA_DIAGNOSTIC.txt
          mkdir -p docs/qa
          cp /tmp/UART005_QA_DIAGNOSTIC.txt docs/qa/UART005_QA_DIAGNOSTIC.txt
      - name: Commit diagnostic and remove diagnostic workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "3Fareet UART-005 Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/uart005-diagnose-stale-contract.yml
          git add docs/qa/UART005_QA_DIAGNOSTIC.txt
          git commit -m "UART-005: capture exact Android QA failure"
          git push origin HEAD:agent/p1-production-world-hard-gate
