name: UART005 Diagnose Stale Contract

on:
  push:
    branches:
      - agent/p1-production-world-hard-gate
    paths:
      - .github/workflows/uart005-diagnose-stale-contract.yml

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-production-world-hard-gate
      - name: Publish exact stale-contract matches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RInE 'all six|six UART-005|6/6|sourceSurfaceProgress|surface-authored candidates|surface-authored candidate' tools docs unity_game/Assets/Afareet .github || true)"
          if [ -z "$matches" ]; then
            matches='NO_MATCHES'
          fi
          body_file="$(mktemp)"
          {
            echo '<!-- UART005_STALE_CONTRACT_DIAGNOSTIC -->'
            echo 'UART-005 stale-contract diagnostic from exact branch head:'
            echo '```text'
            printf '%s\n' "$matches" | head -120
            echo '```'
          } > "$body_file"
          python - "$body_file" <<'PY'
          import json, os, pathlib, subprocess, sys
          body=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          repo=os.environ['REPOSITORY']
          token=os.environ['GH_TOKEN']
          payload=json.dumps({'body': body}).encode()
          subprocess.run([
              'curl','--fail-with-body','-sS','-X','POST',
              '-H','Accept: application/vnd.github+json',
              '-H',f'Authorization: Bearer {token}',
              '-H','X-GitHub-Api-Version: 2022-11-28',
              f'https://api.github.com/repos/{repo}/issues/131/comments',
              '-d',payload.decode(),
          ],check=True)
          PY
