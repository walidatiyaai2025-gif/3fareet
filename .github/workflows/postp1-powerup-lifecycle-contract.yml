name: Post-P1 Power-Up Lifecycle Contract

on:
  pull_request:
    paths:
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpEffectState.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpEffectState.cs.meta'
      - 'unity_game/Assets/Afareet/Tests/EditMode/Race/PowerUpEffectStateTests.cs'
      - 'unity_game/Assets/Afareet/Tests/EditMode/Race/PowerUpEffectStateTests.cs.meta'
      - 'tools/android/contracts/PowerUpLifecycleCompile.csproj'
      - 'tools/android/tests/test_postp1_powerup_lifecycle_contract.py'
      - '.github/workflows/postp1-powerup-lifecycle-contract.yml'
  push:
    branches:
      - main
      - agent/p1-remediation-convergence
    paths:
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpEffectState.cs'
      - 'unity_game/Assets/Afareet/Scripts/Race/PowerUpEffectState.cs.meta'
      - 'unity_game/Assets/Afareet/Tests/EditMode/Race/PowerUpEffectStateTests.cs'
      - 'unity_game/Assets/Afareet/Tests/EditMode/Race/PowerUpEffectStateTests.cs.meta'
      - 'tools/android/contracts/PowerUpLifecycleCompile.csproj'
      - 'tools/android/tests/test_postp1_powerup_lifecycle_contract.py'
      - '.github/workflows/postp1-powerup-lifecycle-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powerup-contract:
    name: Power-up lifecycle compile + contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile pure C# power-up lifecycle contract
        run: dotnet build tools/android/contracts/PowerUpLifecycleCompile.csproj --configuration Release --nologo

      - name: Run power-up lifecycle source contract tests
        run: python3 tools/android/tests/test_postp1_powerup_lifecycle_contract.py
