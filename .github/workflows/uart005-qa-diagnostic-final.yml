name: UART005 QA Diagnostic Final

on:
  push:
    branches:
      - agent/p1-production-world-hard-gate
    paths:
      - .github/workflows/uart005-qa-diagnostic-final.yml

permissions:
  contents: write

concurrency:
  group: uart005-qa-diagnostic-final
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-production-world-hard-gate
          fetch-depth: 0
      - name: Capture exact full-suite failure
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest discover -s tools/android/tests -p 'test_*.py' -v > /tmp/uart005-unittest.log 2>&1
          rc=$?
          set -e
          {
            echo "exit_code=$rc"
            echo '=== failure/error anchors ==='
            grep -nE '^(FAIL|ERROR):|^FAILED \(|^Traceback \(most recent call last\):|AssertionError' /tmp/uart005-unittest.log || true
            echo '=== final 320 lines ==='
            tail -320 /tmp/uart005-unittest.log
          } > docs/qa/UART005_QA_DIAGNOSTIC_FINAL.txt
      - name: Commit diagnostic and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "3Fareet UART-005 Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/uart005-qa-diagnostic-final.yml
          git add docs/qa/UART005_QA_DIAGNOSTIC_FINAL.txt
          git commit -m "UART-005: capture remaining QA failure"
          git push origin HEAD:agent/p1-production-world-hard-gate
