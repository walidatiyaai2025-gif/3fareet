name: Post-P1 Vehicle Catalog Contract

on:
  pull_request:
    paths:
      - 'unity_game/Assets/Afareet/Scripts/Vehicle/VehicleCatalog.cs'
      - 'unity_game/Assets/Afareet/Scripts/Vehicle/VehicleCatalog.cs.meta'
      - 'unity_game/Assets/Afareet/Tests/EditMode/VehicleCatalogPolicyTests.cs'
      - 'unity_game/Assets/Afareet/Tests/EditMode/VehicleCatalogPolicyTests.cs.meta'
      - 'tools/android/contracts/VehicleCatalogCompile.csproj'
      - 'tools/android/tests/test_postp1_vehicle_catalog_contract.py'
      - '.github/workflows/postp1-vehicle-catalog-contract.yml'
  push:
    branches:
      - main
      - agent/p1-remediation-convergence
    paths:
      - 'unity_game/Assets/Afareet/Scripts/Vehicle/VehicleCatalog.cs'
      - 'unity_game/Assets/Afareet/Scripts/Vehicle/VehicleCatalog.cs.meta'
      - 'unity_game/Assets/Afareet/Tests/EditMode/VehicleCatalogPolicyTests.cs'
      - 'unity_game/Assets/Afareet/Tests/EditMode/VehicleCatalogPolicyTests.cs.meta'
      - 'tools/android/contracts/VehicleCatalogCompile.csproj'
      - 'tools/android/tests/test_postp1_vehicle_catalog_contract.py'
      - '.github/workflows/postp1-vehicle-catalog-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-contract:
    name: Vehicle catalog compile + contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile pure C# catalog contract
        run: dotnet build tools/android/contracts/VehicleCatalogCompile.csproj --configuration Release --nologo

      - name: Run catalog source contract tests
        run: python3 tools/android/tests/test_postp1_vehicle_catalog_contract.py
