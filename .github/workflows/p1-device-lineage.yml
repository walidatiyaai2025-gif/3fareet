name: P1 Device Lineage Binding

on:
  pull_request:
    paths:
      - 'tools/android/prepare_p1_candidate_device.py'
      - 'tools/android/tests/test_prepare_p1_candidate_device.py'
      - '.github/workflows/p1-device-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-device-lineage:
    name: P1 device lineage pre-ADB contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python syntax and CLI contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/android/prepare_candidate_device.py \
            tools/android/prepare_p1_candidate_device.py
          python3 tools/android/prepare_p1_candidate_device.py --help >/dev/null

      - name: Execute P1 device lineage regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/android/tests -p 'test_prepare_p1_candidate_device.py' -v
