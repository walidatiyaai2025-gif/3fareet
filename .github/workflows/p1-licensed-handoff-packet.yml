name: P1 Licensed Handoff Packet

on:
  pull_request:
    paths:
      - 'tools/android/p1_licensed_handoff_packet.py'
      - 'tools/android/p1_operator_release_chain.json'
      - 'tools/android/p1_visual_source_readiness.py'
      - 'tools/android/p1_licensed_staging_readiness.py'
      - 'tools/android/verify_p1_licensed_handoff_packet_windows.ps1'
      - 'tools/android/run_p1_licensed_staging_windows.ps1'
      - 'tools/android/stage_production_candidate_windows.ps1'
      - 'tools/android/tests/test_p1_licensed_handoff_packet.py'
      - 'tools/android/tests/test_p1_native_handoff_enforcement.py'
      - 'docs/RELEASE_POLICY.md'
      - '.github/workflows/p1-licensed-handoff-packet.yml'

permissions:
  contents: read

jobs:
  licensed-handoff-packet:
    name: P1 licensed handoff packet contract
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Python syntax and CLI contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/android/p1_licensed_handoff_packet.py
          python3 tools/android/p1_licensed_handoff_packet.py --help >/dev/null

      - name: PowerShell handoff and staging syntax
        shell: pwsh
        run: |
          foreach ($relativePath in @(
            'tools/android/verify_p1_licensed_handoff_packet_windows.ps1',
            'tools/android/run_p1_licensed_staging_windows.ps1',
            'tools/android/stage_production_candidate_windows.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $relativePath),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${relativePath}: $($_.Message)" }
              exit 1
            }
          }

      - name: Execute licensed handoff packet regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/android/tests -p 'test_p1_licensed_handoff_packet.py' -v

      - name: Produce current blocked PR-merge handoff packet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-staging
          python3 tools/android/p1_licensed_handoff_packet.py \
            --expected-git-sha "$EXPECTED_HEAD_SHA" \
            --allow-blocked \
            --output artifacts/production-staging/p1-licensed-handoff-packet.json >/dev/null
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = json.loads(Path('artifacts/production-staging/p1-licensed-handoff-packet.json').read_text())
          identity = p['gitIdentity']
          expected = os.environ['EXPECTED_HEAD_SHA'].lower()
          assert p['schemaVersion'] == 2
          assert p['state'] == 'BLOCKED_EXTERNAL_VISUAL_SOURCES', p['state']
          assert p['visualSourceSummary']['sourceReadyCount'] == 4
          assert p['visualSourceSummary']['blockedCount'] == 2
          assert p['visualSourceSummary']['blockedTaskIds'] == ['UART-003', 'UART-004']
          assert identity['expectedGitSha'] == expected
          assert identity['observedGitSha'] != expected
          assert identity['gitIdentityMatched'] is False
          assert identity['syntheticPullRequestMerge'] is True
          assert identity['exactSourceIdentitySatisfied'] is False
          assert identity['status'] == 'SYNTHETIC_PR_MERGE_REF'
          assert p['releaseHandoffEligible'] is False
          assert p['licensedUnityExecuted'] is False
          assert p['candidateBuildStarted'] is False
          assert p['verified'] is False
          assert p['commands']['licensedUnityStaging'].startswith('pwsh -File tools/android/run_p1_licensed_staging_windows.ps1 ')
          assert '-HandoffPacket artifacts/production-staging/p1-licensed-handoff-packet.json' in p['commands']['licensedUnityStaging']
          print(
              'AFAREET_P1_LICENSED_HANDOFF_PR_IDENTITY_OK '
              f"observed={identity['observedGitSha']} expected={expected} "
              'syntheticMerge=true visualBlocked=UART-003,UART-004 releaseHandoffEligible=false verified=false'
          )
          PY
