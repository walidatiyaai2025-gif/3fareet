name: Android QA Tools

on:
  pull_request:
    paths:
      - 'tools/android/**'
      - 'docs/qa/ANDROID_DEVICE_EVIDENCE_HARNESS.md'
      - 'docs/qa/P1_FINAL_5_GATE_PLAN.md'
      - 'docs/qa/UNITY_CI_UNBLOCK.md'
      - '.github/workflows/android-qa-tools.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/android/**'
      - 'docs/qa/ANDROID_DEVICE_EVIDENCE_HARNESS.md'
      - 'docs/qa/P1_FINAL_5_GATE_PLAN.md'
      - 'docs/qa/UNITY_CI_UNBLOCK.md'
      - '.github/workflows/android-qa-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Android evidence harness unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python syntax and CLI contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/android/device_evidence.py tools/android/p1_gate_readiness.py
          python3 tools/android/device_evidence.py --help >/dev/null
          python3 tools/android/device_evidence.py prepare --help >/dev/null
          python3 tools/android/device_evidence.py capture --help >/dev/null
          python3 tools/android/device_evidence.py finish --help >/dev/null
          python3 tools/android/p1_gate_readiness.py --help >/dev/null
          python3 tools/android/p1_gate_readiness.py plan >/dev/null
          python3 -m json.tool tools/android/p1_gate_spec.json >/dev/null

      - name: Validate Windows local-build PowerShell contract
        shell: pwsh
        run: |
          $scriptPath = Resolve-Path 'tools/android/build_current_windows.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          $scriptText = Get-Content -Raw $scriptPath
          if ($scriptText.Contains('& $UnityPath \')) {
            throw 'Invalid PowerShell invocation: backslash must not be used as a line-continuation argument for Unity.'
          }
          if (-not $scriptText.Contains('& $UnityPath @unityArgs')) {
            throw 'Unity invocation must use the explicit $unityArgs argument array.'
          }
          if (-not $scriptText.Contains('git is required for SHA-pinned build evidence')) {
            throw 'Local build must fail closed when Git is unavailable.'
          }
          if (-not $scriptText.Contains('releaseEvidenceEligible')) {
            throw 'Local build metadata must distinguish clean release evidence from dirty debug builds.'
          }
          Write-Host 'PowerShell syntax and semantic contract OK.'

      - name: Run standard-library unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/android/tests -p 'test_*.py' -v
