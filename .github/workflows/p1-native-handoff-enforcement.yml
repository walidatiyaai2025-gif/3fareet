name: P1 Native Handoff Enforcement

on:
  pull_request:
    paths:
      - 'tools/android/p1_operator_release_chain.json'
      - 'tools/android/p1_licensed_handoff_packet.py'
      - 'tools/android/verify_p1_licensed_handoff_packet_windows.ps1'
      - 'tools/android/run_p1_licensed_staging_windows.ps1'
      - 'tools/android/stage_production_candidate_windows.ps1'
      - 'tools/android/tests/test_p1_native_handoff_enforcement.py'
      - 'tools/android/tests/test_p1_operator_release_chain_contract.py'
      - 'tools/android/tests/test_p1_licensed_handoff_packet.py'
      - '.github/workflows/p1-native-handoff-enforcement.yml'

permissions:
  contents: read

jobs:
  native-handoff-enforcement:
    name: Native packet gate before licensed staging
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse native PowerShell entrypoints
        shell: pwsh
        run: |
          foreach ($relativePath in @(
            'tools/android/verify_p1_licensed_handoff_packet_windows.ps1',
            'tools/android/run_p1_licensed_staging_windows.ps1',
            'tools/android/stage_production_candidate_windows.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $relativePath),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${relativePath}: $($_.Message)" }
              exit 1
            }
          }

      - name: Execute native handoff enforcement fixtures
        shell: pwsh
        run: |
          python -m unittest discover -s tools/android/tests -p 'test_p1_native_handoff_enforcement.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute operator and packet source contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tools/android/tests -p 'test_p1_operator_release_chain_contract.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/android/tests -p 'test_p1_licensed_handoff_packet.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
