name: Post-P1 Garage Runtime Contract

on:
  pull_request:
    paths:
      - 'unity_game/Assets/Afareet/Scripts/GarageRuntime/**'
      - 'unity_game/Assets/Afareet/Scripts/CareerRuntime/CareerGarageBridge.cs'
      - 'unity_game/Assets/Afareet/Scripts/CareerRuntime/CareerGarageSession.cs'
      - 'unity_game/Assets/Afareet/Scripts/CareerRuntime/Afareet.CareerRuntime.asmdef'
      - 'unity_game/Assets/Afareet/Scripts/Core/AfareetBootstrap.cs'
      - 'unity_game/Assets/Afareet/Tests/EditMode/Garage/**'
      - 'tools/android/contracts/GarageRuntimeCompile.csproj'
      - 'tools/android/contracts/GarageRuntimeContractRunner.csproj'
      - 'tools/android/contracts/GarageRuntimeContractRunner.cs'
      - 'tools/android/tests/test_post_p1_garage_runtime_contract.py'
      - '.github/workflows/postp1-garage-runtime-contract.yml'
  push:
    branches:
      - main
      - agent/p1-remediation-convergence
    paths:
      - 'unity_game/Assets/Afareet/Scripts/GarageRuntime/**'
      - 'unity_game/Assets/Afareet/Scripts/CareerRuntime/CareerGarageBridge.cs'
      - 'unity_game/Assets/Afareet/Scripts/CareerRuntime/CareerGarageSession.cs'
      - 'unity_game/Assets/Afareet/Scripts/CareerRuntime/Afareet.CareerRuntime.asmdef'
      - 'unity_game/Assets/Afareet/Scripts/Core/AfareetBootstrap.cs'
      - 'unity_game/Assets/Afareet/Tests/EditMode/Garage/**'
      - 'tools/android/contracts/GarageRuntimeCompile.csproj'
      - 'tools/android/contracts/GarageRuntimeContractRunner.csproj'
      - 'tools/android/contracts/GarageRuntimeContractRunner.cs'
      - 'tools/android/tests/test_post_p1_garage_runtime_contract.py'
      - '.github/workflows/postp1-garage-runtime-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  garage-runtime-contract:
    name: Garage pure C# compile + behavior contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile Garage domain without Unity
        run: dotnet build tools/android/contracts/GarageRuntimeCompile.csproj --configuration Release --nologo

      - name: Run Garage behavior contract
        run: dotnet run --project tools/android/contracts/GarageRuntimeContractRunner.csproj --configuration Release --nologo

      - name: Run Garage source contracts
        run: python3 tools/android/tests/test_post_p1_garage_runtime_contract.py
