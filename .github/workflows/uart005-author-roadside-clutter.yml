name: UART005 Author Roadside Clutter

on:
  push:
    branches:
      - agent/p1-production-world-hard-gate
    paths:
      - .github/workflows/uart005-author-roadside-clutter.yml

permissions:
  contents: write

concurrency:
  group: uart005-author-roadside-clutter
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/p1-production-world-hard-gate
          fetch-depth: 0

      - name: Author three distinct roadside clutter source candidates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/p1-production-world-hard-gate
          git reset --hard origin/agent/p1-production-world-hard-gate
          git fetch origin 5cf93078004fd511c84534a5a1af3c27e3849462
          git show 5cf93078004fd511c84534a5a1af3c27e3849462:tools/android/surface_obj_candidate.py > /tmp/surface_obj_candidate.py

          python - <<'PY'
          from __future__ import annotations
          import math
          import struct
          import zlib
          from pathlib import Path

          root = Path('docs/assets/02_tracks_environments/cairo_street_kit/source')
          root.mkdir(parents=True, exist_ok=True)

          class Mesh:
              def __init__(self, name):
                  self.name=name
                  self.vertices=[]
                  self.faces=[]

              def v(self,x,y,z):
                  self.vertices.append((x,y,z)); return len(self.vertices)

              def box(self,cx,cy,cz,sx,sy,sz):
                  x0,x1=cx-sx/2,cx+sx/2; y0,y1=cy-sy/2,cy+sy/2; z0,z1=cz-sz/2,cz+sz/2
                  a,b,c,d,e,f,g,h=[self.v(*p) for p in (
                      (x0,y0,z0),(x1,y0,z0),(x1,y1,z0),(x0,y1,z0),
                      (x0,y0,z1),(x1,y0,z1),(x1,y1,z1),(x0,y1,z1))]
                  self.faces += [(a,b,c),(a,c,d),(e,g,f),(e,h,g),(a,e,f),(a,f,b),
                                 (b,f,g),(b,g,c),(c,g,h),(c,h,d),(d,h,e),(d,e,a)]

              def frustum(self,cx,cz,y0,y1,r0,r1,segments=12):
                  bottom=[]; top=[]
                  for i in range(segments):
                      a=2*math.pi*i/segments
                      bottom.append(self.v(cx+r0*math.cos(a),y0,cz+r0*math.sin(a)))
                      top.append(self.v(cx+r1*math.cos(a),y1,cz+r1*math.sin(a)))
                  bc=self.v(cx,y0,cz); tc=self.v(cx,y1,cz)
                  for i in range(segments):
                      j=(i+1)%segments
                      self.faces += [(bottom[i],bottom[j],top[j]),(bottom[i],top[j],top[i]),
                                     (bc,bottom[j],bottom[i]),(tc,top[i],top[j])]

              def cylinder(self,cx,cz,y0,y1,r,segments=12):
                  self.frustum(cx,cz,y0,y1,r,r,segments)

              def write(self,path):
                  lines=[f'# UART-005 authored roadside clutter source: {self.name}',f'o {self.name}','s 1']
                  lines += [f'v {x:.5f} {y:.5f} {z:.5f}' for x,y,z in self.vertices]
                  lines += [f'f {a} {b} {c}' for a,b,c in self.faces]
                  path.write_text('\n'.join(lines)+'\n',encoding='utf-8')

          # Planter: tapered pot, rim, soil cap, trunk cluster and stylized leaf volumes.
          p=Mesh('SM_Prop_CairoPlanter_A')
          p.frustum(0,0,0.0,0.62,0.42,0.50,16)
          p.cylinder(0,0,0.58,0.72,0.54,16)
          p.cylinder(0,0,0.70,0.76,0.43,16)
          for x,z in ((0,0),(-.12,.08),(.12,-.05)):
              p.box(x,1.00,z,.08,.56,.08)
          for x,y,z,sx,sy,sz in (
              (-.28,1.28,.03,.50,.12,.24),(.28,1.23,.00,.50,.12,.24),
              (0,1.42,-.20,.28,.12,.46),(0,1.38,.20,.28,.12,.46),
              (-.16,1.54,-.12,.34,.10,.24),(.18,1.52,.12,.34,.10,.24)):
              p.box(x,y,z,sx,sy,sz)
          p.write(root/'SM_Prop_CairoPlanter_A.obj')

          # Market crate stack: three offset crates plus visible slats/feet.
          c=Mesh('SM_Prop_CairoCrateStack_A')
          crate_specs=((0,0.28,0,.92,.54,.70),(.12,.83,.05,.86,.50,.66),(-.08,1.34,-.04,.78,.46,.60))
          for idx,(cx,cy,cz,sx,sy,sz) in enumerate(crate_specs):
              c.box(cx,cy,cz,sx,sy,sz)
              for dz in (-sz*.36,0,sz*.36): c.box(cx,cy,cz+dz,sx*.94,.065,.075)
              for dx in (-sx*.36,0,sx*.36): c.box(cx+dx,cy,cz,.075,.065,sz*.88)
              c.box(cx,cy+sy*.42,cz,sx*.88,.06,sz*.88)
              c.box(cx,cy-sy*.42,cz,sx*.88,.06,sz*.88)
          c.write(root/'SM_Prop_CairoCrateStack_A.obj')

          # Cafe table set: round pedestal/tabletop plus two stools with foot rings.
          t=Mesh('SM_Prop_CairoCafeTable_A')
          t.cylinder(0,0,0.0,.08,.48,16)
          t.cylinder(0,0,.06,.74,.09,12)
          t.cylinder(0,0,.70,.82,.58,20)
          for sx in (-.78,.78):
              t.cylinder(sx,0,0.0,.05,.24,12)
              t.cylinder(sx,0,.04,.46,.065,10)
              t.cylinder(sx,0,.43,.52,.30,14)
              # simple backrest frame and panel
              t.box(sx,.73,.22,.08,.48,.08)
              t.box(sx,.73,-.22,.08,.48,.08)
              t.box(sx,.88,0,.08,.24,.50)
          t.write(root/'SM_Prop_CairoCafeTable_A.obj')

          def chunk(kind,data):
              return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)

          def texture(path,base,accent,mode):
              w=h=64; rows=bytearray()
              for y in range(h):
                  rows.append(0)
                  for x in range(w):
                      grain=((x*11+y*7+mode*13)%29)<3
                      seam=x%16 in (0,1) or y%16 in (0,1)
                      rgb=accent if seam or grain else tuple(min(255,v+(8 if ((x//8+y//8)%2) else 0)) for v in base)
                      rows.extend(rgb)
              payload=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(rows),9))+chunk(b'IEND',b'')
              path.write_bytes(payload)

          texture(root/'T_Prop_CairoPlanter_A_BC.png',(78,72,52),(40,118,72),1)
          texture(root/'T_Prop_CairoCrateStack_A_BC.png',(116,76,42),(58,34,24),2)
          texture(root/'T_Prop_CairoCafeTable_A_BC.png',(58,62,72),(186,126,56),3)
          PY

          ROOT=docs/assets/02_tracks_environments/cairo_street_kit/source
          TOOL=/tmp/surface_obj_candidate.py
          python "$TOOL" "$ROOT/SM_Prop_CairoPlanter_A.obj" --material-file SM_Prop_CairoPlanter_A.mtl --material Planter_Surface --write
          python "$TOOL" "$ROOT/SM_Prop_CairoCrateStack_A.obj" --material-file SM_Prop_CairoCrateStack_A.mtl --material Crate_Surface --write
          python "$TOOL" "$ROOT/SM_Prop_CairoCafeTable_A.obj" --material-file SM_Prop_CairoCafeTable_A.mtl --material Cafe_Surface --write

          cat > "$ROOT/SM_Prop_CairoPlanter_A.mtl" <<'EOF'
          newmtl Planter_Surface
          Ka 0.050000 0.045000 0.035000
          Kd 0.330000 0.300000 0.220000
          Ks 0.080000 0.070000 0.060000
          Ns 14.000000
          illum 2
          map_Kd T_Prop_CairoPlanter_A_BC.png
          EOF
          cat > "$ROOT/SM_Prop_CairoCrateStack_A.mtl" <<'EOF'
          newmtl Crate_Surface
          Ka 0.055000 0.035000 0.025000
          Kd 0.410000 0.250000 0.120000
          Ks 0.060000 0.050000 0.040000
          Ns 10.000000
          illum 2
          map_Kd T_Prop_CairoCrateStack_A_BC.png
          EOF
          cat > "$ROOT/SM_Prop_CairoCafeTable_A.mtl" <<'EOF'
          newmtl Cafe_Surface
          Ka 0.035000 0.040000 0.050000
          Kd 0.260000 0.285000 0.330000
          Ks 0.300000 0.300000 0.320000
          Ns 52.000000
          illum 2
          map_Kd T_Prop_CairoCafeTable_A_BC.png
          EOF

          python "$TOOL" "$ROOT/SM_Prop_CairoPlanter_A.obj" --material-file SM_Prop_CairoPlanter_A.mtl --material Planter_Surface --check
          python "$TOOL" "$ROOT/SM_Prop_CairoCrateStack_A.obj" --material-file SM_Prop_CairoCrateStack_A.mtl --material Crate_Surface --check
          python "$TOOL" "$ROOT/SM_Prop_CairoCafeTable_A.obj" --material-file SM_Prop_CairoCafeTable_A.mtl --material Cafe_Surface --check

          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('docs/assets/02_tracks_environments/cairo_street_kit/source')
          floors={
              'SM_Prop_CairoPlanter_A.obj':(140,220),
              'SM_Prop_CairoCrateStack_A.obj':(180,260),
              'SM_Prop_CairoCafeTable_A.obj':(180,260),
          }
          digests=[]
          for name,(mv,mt) in floors.items():
              lines=(root/name).read_text(encoding='utf-8').splitlines()
              v=sum(line.startswith('v ') for line in lines)
              t=sum(max(0,len(line.split())-3) for line in lines if line.startswith('f '))
              if v < mv or t < mt:
                  raise SystemExit(f'{name}: floor failed {v}v/{t}t expected>={mv}/{mt}')
              digest=hashlib.sha256((root/name).read_bytes()).hexdigest(); digests.append(digest)
              print(f'AFAREET_UART005_CLUTTER_SOURCE_OK model={name} vertices={v} triangles={t} sha256={digest}')
          if len(set(digests)) != 3:
              raise SystemExit('UART-005 clutter source candidates are not distinct')
          PY
          git diff --check

      - name: Commit clutter source assets and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "3Fareet UART-005 Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/uart005-author-roadside-clutter.yml
          git add docs/assets/02_tracks_environments/cairo_street_kit/source
          git status --short
          git diff --cached --check
          git commit -m "UART-005: add Cairo roadside clutter sources"
          git push origin HEAD:agent/p1-production-world-hard-gate
