name: Unity Package Contract

on:
  pull_request:
    paths:
      - 'unity_game/Packages/**'
      - 'tools/android/verify_unity_package_lock.py'
      - 'tools/android/tests/test_verify_unity_package_lock.py'
      - '.github/workflows/unity-package-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'unity_game/Packages/**'
      - 'tools/android/verify_unity_package_lock.py'
      - 'tools/android/tests/test_verify_unity_package_lock.py'
      - '.github/workflows/unity-package-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-contract:
    name: Unity manifest/lock consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate verifier syntax
        run: python3 -m py_compile tools/android/verify_unity_package_lock.py

      - name: Validate Unity manifest and package lock
        run: python3 tools/android/verify_unity_package_lock.py

      - name: Run package-lock regression tests
        run: python3 -m unittest tools.android.tests.test_verify_unity_package_lock -v
